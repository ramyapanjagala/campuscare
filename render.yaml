services:
  - type: web
    name: campuscare-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # Set this manually in Render dashboard
      - key: ADMIN_SECRET
        sync: false        # Set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false        # Set to your Vercel URL after deploying frontend
